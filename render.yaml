services:
  - type: web
    name: floodwatch
    runtime: python
    plan: starter
    region: singapore
    buildCommand: echo "No external dependencies to install"
    startCommand: if [ ! -f /var/data/flood_data.db ]; then cp flood_data.db /var/data/flood_data.db; fi; python main.py --host 0.0.0.0 --port $PORT --db /var/data/flood_data.db
    healthCheckPath: /api/summary
    disk:
      name: floodwatch-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLOODWATCH_ADMIN_USERNAME
        value: flood-admin
      - key: FLOODWATCH_ADMIN_PASSWORD
        sync: false
