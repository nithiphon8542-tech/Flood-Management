services:
  - type: web
    name: floodwatch
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/summary
    envVars:
      - key: FLOODWATCH_ADMIN_USERNAME
        value: flood-admin
      - key: FLOODWATCH_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
